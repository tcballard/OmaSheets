[workspace]
members = [
  "crates/omasheets-calc",
  "crates/omasheets-core",
  "crates/omasheets-corpus",
  "crates/omasheets-store",
  "crates/omasheets-xlsx",
]
exclude = ["spikes/fastcore"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
