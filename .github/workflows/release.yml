name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  native-package:
    name: Build native release bundle
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git cmake gtk3 libreoffice-fresh libreoffice-fresh-sdk
      - uses: actions/checkout@v7
      - name: Require the tag to match the product version
        run: |
          version=$(python -c 'from pathlib import Path; import sys; sys.path.insert(0, "src"); import omasheets; print(omasheets.__version__)')
          test "$GITHUB_REF_NAME" = "v$version"
          PYTHONPATH=src python -m unittest discover -s tests -q
          python -m compileall -q src tests scripts
          python scripts/check_release.py
      - run: python scripts/build_native_bundle.py --output dist-native
      - uses: actions/upload-artifact@v4
        with:
          name: native-release
          path: dist-native/
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    needs: native-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-release
          path: dist-native
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "OmaSheets $GITHUB_REF_NAME"
          --generate-notes
          dist-native/*
