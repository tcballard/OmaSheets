name: Release

# Every input of a release build is pinned: actions by full commit SHA, the
# container image by digest, and the Arch package set by an Arch Linux Archive
# snapshot date. The bundle records those inputs so a maintainer can rebuild it
# bit for bit before signing it offline with the release key pinned in
# release/signing-key.pub. The publish job additionally attests the archive
# through GitHub's build-provenance flow, a second trust root that the
# release credential cannot forge.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ARCH_SNAPSHOT: 2026/09/01
  BUILD_IMAGE: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6

jobs:
  native-package:
    name: Build native release bundle
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    steps:
      - name: Pin the package set to an Arch Linux Archive snapshot
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCH_SNAPSHOT" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed git cmake rust gtk3 libreoffice-fresh libreoffice-fresh-sdk qt6-base qt6-declarative qt6-wayland
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the tag to match the product version and the pinned release key
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(python -c 'from pathlib import Path; import sys; sys.path.insert(0, "src"); import omasheets; print(omasheets.__version__)')
          test "$GITHUB_REF_NAME" = "v$version"
          PYTHONPATH=src python -m unittest discover -s tests -q
          python -m compileall -q src tests scripts
          python scripts/check_release.py --require-exact-version-tag
      - name: Record the build inputs
        run: |
          mkdir -p dist-native
          python scripts/build_inputs.py \
            --image "$BUILD_IMAGE" \
            --snapshot "$ARCH_SNAPSHOT" \
            --source-date-epoch "$(git log -1 --format=%ct)" \
            "--cxxflags=-ffile-prefix-map=$GITHUB_WORKSPACE=/omasheets" \
            --output dist-native/build-inputs.json
      - name: Build the bundle reproducibly
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export CXXFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/omasheets"
          python scripts/build_native_bundle.py --output dist-native --build-inputs dist-native/build-inputs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release
          path: dist-native/
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    needs: native-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-release
          path: dist-native
      - name: Attest the bundle's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-native/omasheets-native-*.tar.gz
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "OmaSheets $GITHUB_REF_NAME"
          --notes "Built from a pinned image, a pinned Arch Linux Archive snapshot and pinned actions; see docs/RELEASE.md. The bundle is installable only after its maintainer-signed .minisig is uploaded."
          dist-native/*
