[package]
name = "omasheets-qt-grid-spike"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[dependencies]
cxx = "=1.0.176"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["full"] }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
