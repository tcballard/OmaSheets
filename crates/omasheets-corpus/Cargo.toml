[package]
name = "omasheets-corpus"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["formualizer"]
formualizer = ["dep:formualizer-workbook"]

[dependencies]
formualizer-workbook = { version = "=0.8.4", default-features = false, features = ["calamine"], optional = true }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
