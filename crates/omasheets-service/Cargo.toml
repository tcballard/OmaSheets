omasheets-store = { path = "../omasheets-store" }
omasheets-xlsx = { path = "../omasheets-xlsx" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
